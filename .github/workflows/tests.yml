name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
      - name: Starter list is valid
        run: python -c "import starter; print(len(starter.load_starter_sources()), 'starter sources')"

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck start.sh

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t bsky-news-feed-bot:ci .
      - name: Smoke test /health and dashboard
        run: |
          docker run -d --name bot -p 127.0.0.1:5000:5000 -e ALLOW_OPEN_DASHBOARD=1 bsky-news-feed-bot:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/health
          curl -fsS http://127.0.0.1:5000/ | grep -q "Connect the account"
          docker stop -t 15 bot
          test "$(docker inspect -f '{{.State.ExitCode}}' bot)" = "0"
      - name: Password protects the dashboard
        run: |
          docker run -d --name locked -p 127.0.0.1:5001:5000 -e DASHBOARD_PASSWORD=ci-secret bsky-news-feed-bot:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5001/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u any:ci-secret http://127.0.0.1:5001/)" = "200"
      - name: Refuses an open dashboard without a password
        run: |
          set +e
          docker run --rm bsky-news-feed-bot:ci
          test $? -eq 2
      - if: failure()
        run: docker logs bot; docker logs locked || true
