# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '31 21 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/github-script@v8
      with:
        script: |
          const labels = [
            { name: 'no-issue-activity', description: 'Issue has had no activity for 60 days.' },
            { name: 'no-pr-activity', description: 'Pull request has had no activity for 60 days.' }
          ];
          const existingLabels = await github.paginate(
            github.rest.issues.listLabelsForRepo,
            { ...context.repo, per_page: 100 }
          );
          const existingNames = new Set(existingLabels.map(label => label.name.toLowerCase()));

          for (const label of labels) {
            if (!existingNames.has(label.name.toLowerCase())) {
              await github.rest.issues.createLabel({
                ...context.repo,
                ...label,
                color: 'ededed'
              });
            }
          }
    - uses: actions/stale@v11
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        days-before-stale: 60
        days-before-close: 7
        stale-issue-message: 'This issue has been marked stale because it has had no activity for 60 days. It will close automatically in 7 days unless there is new activity.'
        stale-pr-message: 'This pull request has been marked stale because it has had no activity for 60 days. It will close automatically in 7 days unless there is new activity.'
        stale-issue-label: 'no-issue-activity'
        stale-pr-label: 'no-pr-activity'
